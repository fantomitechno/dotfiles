name: mastodon
services:
  db:
    restart: always
    image: postgres:14-alpine
    container_name: mastodon_postgres
    shm_size: 256mb
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_USER}
      POSTGRES_USER: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASS}

  redis:
    restart: always
    image: redis:7-alpine
    container_name: mastodon_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

  web:
    image: ghcr.io/mastodon/mastodon:v4.6.2
    container_name: mastodon_web
    restart: always
    env_file: .env
    command: bundle exec puma -C config/puma.rb
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --noproxy localhost localhost:3000/health | grep -q 'OK' || exit 1",
        ]
    ports:
      - "127.0.0.1:2020:3000"
    depends_on:
      - db
      - redis
    volumes:
      - /var/mastodon/public:/mastodon/public
      - /nas/mastodon/system:/mastodon/public/system

  streaming:
    image: ghcr.io/mastodon/mastodon-streaming:v4.6.2
    container_name: mastodon_streaming
    restart: always
    env_file: .env
    command: node ./streaming/index.js
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --noproxy localhost localhost:4000/api/v1/streaming/health | grep -q 'OK' || exit 1",
        ]
    ports:
      - "127.0.0.1:2021:4000"
    depends_on:
      - db
      - redis

  sidekiq:
    image: ghcr.io/mastodon/mastodon:v4.6.2
    container_name: mastodon_sidekiq
    restart: always
    env_file: .env
    command: bundle exec sidekiq
    depends_on:
      - db
      - redis
    volumes:
      - /nas/mastodon/system:/mastodon/public/system
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[s]idekiq\ 8' || false"]

volumes:
  pg_data:
