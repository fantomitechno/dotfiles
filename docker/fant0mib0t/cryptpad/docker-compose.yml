name: cryptpad
services:
  cryptpad:
    image: "cryptpad/cryptpad:version-2026.10.0"
    container_name: cryptpad
    restart: unless-stopped

    environment:
      - CPAD_MAIN_DOMAIN=https://drive.renoux.dev
      - CPAD_SANDBOX_DOMAIN=https://drive.s.renoux.dev

      # Read and accept the license before uncommenting the following line:
      # https://github.com/Euro-Office/web-apps/raw/refs/heads/main/LICENSE.txt
      - CPAD_INSTALL_OFFICE=yes

    volumes:
      - /nas/cryptpad/blob:/cryptpad/blob
      - /nas/cryptpad/block:/cryptpad/block
      - /var/cryptpad/customize:/cryptpad/customize
      - /nas/cryptpad/data:/cryptpad/data
      - /nas/cryptpad/files:/cryptpad/datastore
      - /var/cryptpad/onlyoffice-dist:/cryptpad/www/common/onlyoffice/dist
      - /var/cryptpad/onlyoffice-conf:/cryptpad/onlyoffice-conf
      - ./config.js:/cryptpad/config/config.js
      - ./infra.js:/cryptpad/config/infra.js

    ports:
      - "127.0.0.1:4020:4020"
      - "127.0.0.1:4021:4021"

    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000
