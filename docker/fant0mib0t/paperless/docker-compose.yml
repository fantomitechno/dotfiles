name: paperless
services:
  broker:
    image: docker.io/library/redis:8
    container_name: paperless_redis
    restart: unless-stopped
    volumes:
      - redisdata:/data

  db:
    image: docker.io/library/postgres:18
    container_name: paperless_postgres
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless

  webserver:
    userns_mode: "keep-id:uid=1000,gid=100"
    environment:
      USERMAP_UID: 1000
      USERMAP_GID: 100
    image: ghcr.io/paperless-ngx/paperless-ngx:3.4.1
    container_name: paperless
    restart: unless-stopped
    depends_on:
      - db
      - broker
    ports:
      - "127.0.0.1:4060:8000"
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - /var/paperless/export:/usr/src/paperless/export:U
      - /nas/paperless/import:/usr/src/paperless/consume:U
    env_file: .env
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db

volumes:
  pg_data:
  data:
  media:
  redisdata:
