name: celeste-mirror
services:
  celeste-mirror:
    # Use my own custom celeste-mirror image
    image: ghcr.io/fantomitechno/celeste-mirror:latest
    container_name: celeste-mirror
    volumes:
      # custom configurations
      - ./config.toml:/app/config.toml
      - /data/celeste/mods:/mods
      - /data/celeste/images:/images
      - /data/celeste/rich_presence:/rich_presences
    restart: unless-stopped
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.run-discovery-on-schedule.schedule: "@monthly"
      ofelia.job-exec.run-discovery-on-schedule.command: "pnpm delete"
  
  ofelia:
    image: mcuadros/ofelia:0.3
    depends_on:
      - celeste-mirror
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro


volumes:
  cnet_data:
